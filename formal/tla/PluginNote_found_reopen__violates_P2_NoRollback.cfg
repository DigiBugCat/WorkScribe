\* The plugin as found. open() runs again for a note that is being typed in, while a sync of it is saving.
\* Bound: 2 keystrokes, 1 reopen, no failures.
SPECIFICATION Spec
CONSTANTS
    MaxType = 2
    MaxPress = 0
    MaxFail = 0
    MaxDrop = 0
    MaxReopen = 1
    MaxExternal = 0
    Meeting = TRUE
    ViewOpen = TRUE
    AppFinalizes = FALSE
    AppPurges = FALSE
    SlowIndex = FALSE
    Polls = FALSE
    FixOneFinalize = FALSE
    FixKeepTyped = FALSE
    FixMeetingOnly = FALSE
    FixRetry = FALSE
    FixFence = FALSE
    FixLearnPurge = FALSE
    FixReopenEditor = FALSE
    FixDropDirty = FALSE
    MutNoCAS = FALSE
    MutGuardNeverCleared = FALSE
INVARIANT P2_NoRollback
CHECK_DEADLOCK FALSE
