    Polls = TRUE
    FixOneFinalize = TRUE
    FixKeepTyped = TRUE
    FixMeetingOnly = TRUE
    FixRetry = TRUE
    FixFence = TRUE
    FixLearnPurge = TRUE
    FixReopenEditor = TRUE
    FixDropDirty = TRUE
    MutNoCAS = FALSE
    MutGuardNeverCleared = FALSE
