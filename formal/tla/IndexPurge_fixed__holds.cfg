\* The working tree: fences, listing and deletion in one transaction; conversations rechecked before
\* any file goes; a blocked checkpoint fails the purge.
SPECIFICATION Spec
CONSTANTS
    Files = {f1, f2}
    Convs = {c1, c2}
    MaxBlocks = 2
    MaxCrashes = 1
    Relaunch = TRUE
    FenceFirst = TRUE
    RootsRechecked = TRUE
    CheckpointChecked = TRUE
    MutNoFences = FALSE
    MutApplyIgnoresRootFence = FALSE
INVARIANT TypeOK
INVARIANT Gone
INVARIANT NothingLeftOnDisk
INVARIANT HealedByLaunch
CHECK_DEADLOCK FALSE
