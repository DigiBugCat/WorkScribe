\* The plugin as found. The meeting is finalized and purged by the app while a sync is under way.
\* Bound: 1 keystroke; the app finalizes and purges on its own.
SPECIFICATION Spec
CONSTANTS
    MaxType = 1
    MaxPress = 0
    MaxFail = 0
    MaxDrop = 0
    MaxReopen = 0
    MaxExternal = 0
    Meeting = TRUE
    ViewOpen = TRUE
    AppFinalizes = TRUE
    AppPurges = TRUE
    SlowIndex = FALSE
    Polls = FALSE
    FixOneFinalize = FALSE
    FixKeepTyped = FALSE
    FixMeetingOnly = FALSE
    FixRetry = FALSE
    FixFence = FALSE
    FixLearnPurge = FALSE
    FixReopenEditor = FALSE
    FixDropDirty = FALSE
    MutNoCAS = FALSE
    MutGuardNeverCleared = FALSE
INVARIANT P4b_NoLedgerAfterPurge
CHECK_DEADLOCK FALSE
