\* Current code (working tree): a 3 s retry (294-298) armed after an earlier stop fires during the final pass of a later, paused stop
\* and resets inputs; the tail then queues one redundant pass.  The model has no clock: in the app this needs a
\* resume, six seconds of recognition lag and a stop inside those three seconds.
SPECIFICATION Spec
CONSTANTS
    NLive = 5
    NFinish = 2
    MaxInputs = 2
    MaxPressure = 1
    MaxStop = 2
    MaxResume = 1
    MaxOtherFinish = 1
    MaxThrow = 1
    MaxMore = 1
    MaxUnsearched = 1
    StartAwaits = FALSE
    MaxResumeFail = 1
    TrackOwed = TRUE
    FixNilGuard = TRUE
    FixFinishDraining = TRUE
    FixToken = TRUE
    FixTailSchedules = TRUE
    FixStartSchedules = TRUE
    FixFinalRecordsInputs = TRUE
    FixNilBranchFence = FALSE
    FixUnpauseSchedules = FALSE
    FixNoSteal = FALSE
    FixCatchSchedules = TRUE
    FixRequeueSuperseded = TRUE
    MutNoRunningGuard = FALSE
    MutNoPatchFence = FALSE
    MutNoSettle = FALSE
    MutYieldKeepsInputs = FALSE
    MutNoDeferSchedule = FALSE
INVARIANT N8_TailScheduleOnlyForNewInput
CHECK_DEADLOCK FALSE
