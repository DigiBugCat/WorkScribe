    MaxPress = 0
    MaxFail = 2
    MaxDrop = 1
    MaxReopen = 1
    MaxExternal = 0
    Meeting = TRUE
    ViewOpen = TRUE
    AppFinalizes = FALSE
    AppPurges = FALSE
    SlowIndex = FALSE
    Polls = FALSE
    FixOneFinalize = TRUE
    FixKeepTyped = TRUE
    FixMeetingOnly = TRUE
    FixRetry = TRUE
    FixFence = TRUE
    FixLearnPurge = TRUE
    FixReopenEditor = TRUE
    FixDropDirty = TRUE
    MutNoCAS = FALSE
    MutGuardNeverCleared = FALSE
INVARIANT TypeOK
INVARIANT P1_NothingTypedIsLost
INVARIANT P1e_EditorKeepsTyped
INVARIANT P2_NoRollback
INVARIANT P3_OneFinalizePerPress
INVARIANT P3b_FailedFinalizeCanBeRetried
INVARIANT P4_QuietAfterPurge
INVARIANT P4b_NoLedgerAfterPurge
